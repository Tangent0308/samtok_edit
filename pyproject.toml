[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samtok-edit21"
version = "0.1.0"
description = "SAMTok region conditioning and two-stage LoRA training for Qwen-Image-2.1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow"]

[project.optional-dependencies]
training = ["diffsynth==2.1.8", "mmengine==0.10.7", "pycocotools==2.0.11", "hydra-core", "opencv-python", "scipy"]
data = ["ijson", "pyarrow"]
test = ["pytest"]

[project.scripts]
samtok-edit = "samtok_edit21.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "samtok" = "third_party/samtok"}

[tool.setuptools.packages.find]
where = ["src", "third_party"]
include = ["samtok_edit21*", "samtok", "samtok.models", "samtok.models.*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
