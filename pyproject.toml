[build-system]
requires = ["setuptools==66.1.1", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[project]
name = "samtok-edit-training"
version = "0.1.0"
description = "Training and evaluation environment for SAMTokEdit"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==1.14.0",
    "byted-wandb==0.13.98",
    "datasets==5.0.1",
    "diffsynth==2.1.2",
    "einops==0.8.2",
    "ftfy==6.3.1",
    "huggingface-hub==1.26.0",
    "imageio==2.37.4",
    "imageio-ffmpeg==0.6.0",
    "modelscope==1.39.1",
    "modelscope-hub==0.2.0",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "peft==0.20.0",
    "pillow==12.3.0",
    "protobuf==3.20.3",
    "pyarrow==25.0.0",
    "pycocotools==2.0.11",
    "PyYAML==6.0.3",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "setuptools==66.1.1",
    "tensorboard==2.20.0",
    "tokenizers==0.22.2",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm==4.67.3",
    "transformers==5.12.1",
    "triton==3.4.0",
    "wheel==0.38.4",
]

[tool.setuptools]
packages = []
